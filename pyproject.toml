[project]
name = "personal-agentic"
version = "0.1.0"
description = "A personal work agent that runs on local models (LM Studio), talks over terminal and web, and runs scheduled routines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "croniter>=6",
    "pyyaml>=6",
    "numpy>=2",
    "rich>=13",
    "prompt_toolkit>=3.0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
pa = "personal_agentic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agentic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240", "ASYNC251"]
